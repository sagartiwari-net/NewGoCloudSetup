<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SellerAmp Login Required</title>
    <style>
      html,
      body {
        background: #f6f8fb;
        height: 100%;
        margin: 0;
      }
      body {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        padding: 22px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #dce3ea;
        border-radius: 8px;
        box-shadow: 0 8px 22px rgba(22, 34, 51, 0.08);
        box-sizing: border-box;
        max-width: 360px;
        padding: 22px 20px;
        width: 100%;
      }
      .icon {
        align-items: center;
        background: #eaf4fb;
        border: 1px solid #c9e4f4;
        border-radius: 8px;
        color: #0678bd;
        display: inline-flex;
        font-size: 20px;
        font-weight: 700;
        height: 42px;
        justify-content: center;
        margin-bottom: 14px;
        width: 42px;
      }
      .title {
        color: #18212c;
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 7px;
      }
      .copy {
        color: #586575;
        font-size: 13px;
        line-height: 1.4;
        margin: 0 auto 16px;
        max-width: 280px;
      }
      .button {
        background: #0678bd;
        border-radius: 6px;
        color: #ffffff;
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 14px;
        text-decoration: none;
      }
      .note {
        color: #7b8794;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">!</div>
      <div class="title">Login Required</div>
      <p class="copy">Please open SellerAmp from your member dashboard, then reopen this panel.</p>
      <a class="button" href="__SAS_PROXY_ORIGIN__/" target="_blank" rel="noreferrer">
        Open SellerAmp
      </a>
      <div class="note">After opening the tool, reopen the SellerAmp panel on Amazon.</div>
    </main>
  </body>
</html>
