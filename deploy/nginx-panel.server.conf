# panel.gt4rents.com — UI (Next :3000) + API (/api → :18090)
# NOTE: :8090 may be taken by other apps (payment-hub) — do not kill them.
# Use as dedicated aaPanel site OR include alongside wildcard.
# First draft — SSL add later.

server {
    listen 80;
    server_name panel.gt4rents.com;

    client_max_body_size 50m;

    # Go panel-api (port 18090)
    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js UI
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
