# panel.gt4rents.com — UI (Next :3000) + API (/api → :18090)
# NOTE: :8090 may be taken by other apps (payment-hub) — do not kill them.
# Use as dedicated aaPanel site OR include alongside wildcard.

server {
    listen 80;
    server_name panel.gt4rents.com;

    client_max_body_size 50m;
    # A fat Cookie jar resets HTTP/2 before Next sees it. Chrome then shows
    # "This page couldn't load" instead of an nginx 400 page.
    client_header_buffer_size 128k;
    large_client_header_buffers 8 128k;

    # Go panel-api (port 18090)
    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
    }

    # Next.js UI. Do not force Connection: upgrade on normal page loads —
    # Next closes that connection and Chrome shows "This page couldn't load".
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
    }
}
