# panel.upays.in — UI (Next :3000) + API (/api → :18090)
# NOTE: :8090 may be taken by other apps (payment-hub) — do not kill them.
# Use as dedicated aaPanel site OR include alongside wildcard.
# If aaPanel already issued SSL, paste the location blocks into the listen 443 server too.

server {
    listen 80;
    server_name panel.upays.in;

    client_max_body_size 50m;
    # A fat Cookie jar resets HTTP/2 before Next sees it. Chrome then shows
    # "This page couldn't load" instead of an nginx 400 page.
    client_header_buffer_size 512k;
    large_client_header_buffers 8 512k;

    # A refresh can still be holding the previous build's HTML. Those chunk
    # URLs 404, the page stays on "Redirecting to sign in", and a click works
    # only because that tab already has the new JavaScript in memory.
    # A missing script answers with a one-time reload so the browser fetches this build.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 404 = @panel_stale_chunk;
    }

    location @panel_stale_chunk {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 '(function(){try{if(sessionStorage.getItem("panel-static-reload")==="1")return;sessionStorage.setItem("panel-static-reload","1");var u=new URL(location.href);u.searchParams.set("__v",String(Date.now()));location.replace(u.toString())}catch(e){}})();';
    }

    # Go panel-api (port 18090)
    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }

    # Next.js UI. Do not force Connection: upgrade on normal page loads —
    # Next closes that connection and Chrome shows "This page couldn't load".
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Do not answer 304. That status makes Chrome reuse the previous HTML.
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        etag off;
        if_modified_since off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }
}
