# aaPanel site: t4toolz.com — Method A like seogbtools / prideseotools.
# server_name *.t4toolz.com t4toolz.com;
# location / → $tool_port
# Keep SSL/443 cert lines from aaPanel.
# DNS grey A: * → 65.109.16.196

server
{
    listen 80;
    server_name *.t4toolz.com t4toolz.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/gt4rents.com;

    client_max_body_size 100m;
    client_header_buffer_size 256k;
    large_client_header_buffers 8 256k;

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    #SSL-END

    error_page 404 /404.html;
    error_page 502 /502.html;

    #include enable-php-00.conf;

    include /www/server/panel/vhost/rewrite/t4toolz.com.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location /
    {
        if ($tool_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$tool_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }

    access_log  /www/wwwlogs/t4toolz.com.log;
    error_log  /www/wwwlogs/t4toolz.com.error.log;
}
