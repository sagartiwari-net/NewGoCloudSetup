# First-draft wildcard reverse proxy for gt4rents.com
# Path root (files): /www/wwwroot/gt4rents.com/
# Requires: nginx-host-port.map.conf loaded in http {} context
# Optional (http{}): map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name *.gt4rents.com gt4rents.com;

    # SSL: add later (wildcard cert)

    client_max_body_size 100m;

    location / {
        if ($tool_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$tool_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Do NOT force Connection: upgrade on every request — that causes random 502s.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
    }
}
