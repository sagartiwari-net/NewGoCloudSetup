# First-draft wildcard reverse proxy for gt4rents.com
# Path root (files): /www/wwwroot/gt4rents.com/
# Requires: nginx-host-port.map.conf loaded in http {} context

server {
    listen 80;
    server_name *.gt4rents.com gt4rents.com;

    # SSL: add later (wildcard cert)

    client_max_body_size 100m;

    location / {
        if ($tool_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$tool_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
