# Wildcard reverse proxy for SeoGroupBuy reseller: *.seogbtools.com
# Same ports as upays.in. Do NOT put apex seogbtools.com here — friend homepage stays on their server.
#
# aaPanel: add a site (primary can be seogbtools.com for the GUI name), then set:
#   server_name *.seogbtools.com;
# Path can stay /www/wwwroot/gt4rents.com/
# Paste location / below. SSL: Let's Encrypt DNS for *.seogbtools.com only (not the apex).
# Map file already lists label.seogbtools.com → same port as label.upays.in.

server {
    listen 80;
    server_name *.seogbtools.com;

    client_max_body_size 100m;
    client_header_buffer_size 256k;
    large_client_header_buffers 8 256k;

    location / {
        if ($tool_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$tool_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }
}
