# aaPanel site: prideseotools.com  (path /www/wwwroot/gt4rents.com)
# Same pattern as seogbtools / amzpremium / t4toolz:
#   server_name *.prideseotools.com prideseotools.com;
#   location / → $tool_port
#
# SSL: aaPanel rejects typing "*." in some UIs. Do this instead:
#   SSL → Let's Encrypt → Domains (one per line, NO star):
#     prideseotools.com
#     refs.prideseotools.com
#   Then Apply + Force HTTPS.
# Keep the SSL / listen 443 block aaPanel already wrote — only sync server_name + location /.
#
# DNS grey A: * and refs → 65.109.16.196
# After edit: nginx -t && nginx -s reload

server
{
    listen 80;
    server_name *.prideseotools.com prideseotools.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/gt4rents.com;

    client_max_body_size 100m;
    client_header_buffer_size 256k;
    large_client_header_buffers 8 256k;

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  do not enable PHP on this site — all hosts proxy to Go tools
    #include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set in the panel
    include /www/server/panel/vhost/rewrite/prideseotools.com.conf;
    #REWRITE-END

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location /
    {
        if ($tool_port = 0) { return 404; }
        proxy_pass http://127.0.0.1:$tool_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $gt4_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }

    access_log  /www/wwwlogs/prideseotools.com.log;
    error_log  /www/wwwlogs/prideseotools.com.error.log;
}
